name: Static analysis
on: [pull_request]

jobs:
  graphql-inspector:
    name: graphql-inspector
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-libvips
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Generate GraphQL schema file
        run: bin/rails graphql:schema:dump
      - uses: kamilkisiela/graphql-inspector@master
        with:
          schema: 'main:schema.graphql'
  rubocop:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: rubocop
        uses: reviewdog/action-rubocop@v2
        with:
          skip_install: true
          use_bundler: true
          only_changed: true
  check-graphql-documents:
    name: check-graphql-documents
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: yarn
      - run: yarn install
      - run: yarn build:framework
      - run: yarn check-graphql-documents
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: yarn
      - run: yarn install
      - run: yarn oxlint app/javascript test/javascript --format=github
      - run: yarn lint:graphql
