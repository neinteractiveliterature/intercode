mutation ChangeSignupBucket($signupId: ID!, $bucketId: ID!) {
  updateSignupBucket(input: { id: $signupId, bucketId: $bucketId }) {
    signup {
      id
      ...SignupFields

      run {
        id
        ...EventPageRunFields
        ...RunBasicSignupData
      }
    }
  }
}

mutation ForceConfirmSignup($signupId: ID!, $bucketId: ID!) {
  forceConfirmSignup(input: { id: $signupId, bucketId: $bucketId }) {
    signup {
      id
      ...SignupFields

      run {
        id
        ...EventPageRunFields
        ...RunBasicSignupData
      }
    }
  }
}

mutation UpdateSignupCounted($signupId: ID!, $counted: Boolean!) {
  updateSignupCounted(input: { id: $signupId, counted: $counted }) {
    signup {
      id
      ...SignupFields

      run {
        id
        ...EventPageRunFields
        ...RunBasicSignupData
      }
    }
  }
}

mutation WithdrawAllUserConProfileSignups($userConProfileId: ID!) {
  withdrawAllUserConProfileSignups(input: { userConProfileId: $userConProfileId }) {
    user_con_profile {
      id

      ...UserConProfileSignupsFragment
    }
  }
}

mutation FreezeBucketAssignments($eventId: ID!) {
  freezeBucketAssignments(input: { id: $eventId }) {
    clientMutationId
  }
}
