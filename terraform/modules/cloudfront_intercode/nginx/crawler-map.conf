# Include in the http block. $is_crawler is 1 for the crawlers that should get the Open Graph shell.
map $http_user_agent $is_crawler {
    default 0;
    ~*(Googlebot|bingbot|DuckDuckBot|YandexBot|Baiduspider|facebookexternalhit|Twitterbot|LinkedInBot|WhatsApp|Discordbot|Slackbot|Applebot|Embedly|Pinterest) 1;
}
