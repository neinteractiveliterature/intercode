server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Convention domains load module scripts cross-origin from the assets host
    add_header Access-Control-Allow-Origin "*" always;

    # The hashed build output never changes
    location /assets/ {
        expires 180d;
        try_files $uri =404;
    }

    # index.html is the one file whose name doesn't change between releases
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
